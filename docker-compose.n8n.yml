name: opencode-docker

x-hardening: &hardening
  restart: no
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18
    <<: *hardening
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      POSTGRES_DB: ${N8N_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - n8n-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    pids_limit: 256
    mem_limit: 1g

  n8n:
    image: n8nio/n8n
    <<: *hardening
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: &tz ${N8N_TIMEZONE:-Europe/Paris}
      TZ: *tz
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV: "true"
      N8N_COMMUNITY_PACKAGES: '[{"name":"n8n-nodes-opencode-v2","version":"0.1.1","checksum":"sha512-5RB+hRO96m6AqGZx+mw5jiVD60ffdX34IE2zBmCMxNONMxfM80R1J0khIuy1XhaUvsocDX2NA1UApb8FoKBwqw=="}]'
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    pids_limit: 512
    mem_limit: 2g

  searxng:
    image: ghcr.io/searxng/searxng:latest
    <<: *hardening
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    pids_limit: 256
    mem_limit: 1g

volumes:
  n8n-data:
  n8n-postgres:
  searxng-cache:
