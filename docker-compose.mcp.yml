name: opencode-docker

# Optional MCP stack for OpenCode. Use it together with the main compose file so both share one
# project and one network (the agent then reaches these services by name):
#
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up
#
# Everything is published on 127.0.0.1 only, for access from this machine; the opencode container
# reaches the same services over the compose network. Authentication for both endpoints is the
# shared MCP_GATEWAY_AUTH_TOKEN from .env (Bearer). Generate one with: openssl rand -hex 32
#
# Servers come from Docker's MCP Catalog (mcp/* images, Docker-built, cosign-verified by the
# gateway), except chrome-devtools-mcp, which is npm-only and has no Docker image; it runs in the
# official Puppeteer image (Chrome for Testing) behind a supergateway stdio→Streamable-HTTP bridge.

services:
  # Docker MCP Gateway: runs the stdio servers as containers on this daemon and serves them all
  # over Streamable HTTP at /mcp. The socket is mounted here (control plane) and intentionally
  # NOT in the opencode container. Catalog servers are pinned to digests and verified against
  # cosign signatures by the gateway.
  mcp-gateway:
    image: docker/mcp-gateway:latest
    command:
      - --servers=sequentialthinking,playwright,fetch,time,duckduckgo,wikipedia-mcp,markitdown,next-devtools-mcp
      - --transport=streaming
      - --port=8080
      - --host=0.0.0.0
      # Per-server limits for the spawned containers (default: 1 CPU, 2 GB memory each)
      - --cpus=1
      - --memory=2Gb
    environment:
      DOCKER_MCP_IN_CONTAINER: "1"
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:?set MCP_GATEWAY_AUTH_TOKEN in .env (e.g. openssl rand -hex 32)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8200}:8080"
    mem_limit: 1g
    cap_drop: [ALL]
    restart: unless-stopped

  # Chrome DevTools MCP (browser inspection/automation). Headless, isolated profile, no usage
  # statistics, no CrUX API reporting. Supergateway bridges stdio -> Streamable HTTP (/mcp)
  # behind the same token.
  chrome-devtools:
    image: ghcr.io/puppeteer/puppeteer:latest
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - npx -y chrome-devtools-mcp@latest --headless --isolated --no-usage-statistics --no-performance-crux
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --apiKey
      - ${MCP_GATEWAY_AUTH_TOKEN:?set MCP_GATEWAY_AUTH_TOKEN in .env}
    volumes:
      # Persist the npx cache so server packages aren't re-downloaded on every start
      - npx-cache:/home/pptruser/.npm
    ports:
      - "127.0.0.1:${MCP_CHROME_DEVTOOLS_PORT:-8203}:8000"
    shm_size: 1gb
    mem_limit: 2g
    restart: unless-stopped

volumes:
  npx-cache:
