name: opencode-docker

services:
  opencode:
    build:
      context: .
      args: [NODE_TAG, PACKAGES, NPM_PACKAGES, PIP_PACKAGES]
    env_file:
      - path: .env
        required: false
    environment:
      # Lets the entrypoint link $HOST_HOME/.ssh -> ~/.ssh inside the container,
      # so the signingkey path from the host's ~/.gitconfig resolves verbatim
      - HOST_HOME=${HOST_HOME:-${HOME:-${USERPROFILE:-/home/opencode}}}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - opencode-config:/home/opencode/.config/opencode
      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-workspace:/home/opencode/workspace
      - opencode-cache:/home/opencode/.cache
      # Global skills: the skills CLI's canonical store and lock live in ~/.agents
      - opencode-global-skills:/home/opencode/.agents
      # Host SSH keys: composed from HOME or USERPROFILE so it works without a HOME env var
      - "${HOME:-${USERPROFILE:-~}}/.ssh:/home/opencode/.ssh-host:ro"
      # Git identity and SSH signing key, inferred from the host's ~/.gitconfig (read-only).
      # Optional: .env values (GIT_USER_NAME / GIT_USER_EMAIL / GIT_SIGNING_KEY) take precedence.
      # The entrypoint also links $HOST_HOME/.ssh -> ~/.ssh (the copy made from .ssh-host), so the
      # signingkey path from the host config resolves verbatim - no same-path mount needed.
      - "${HOME:-${USERPROFILE:-~}}/.gitconfig:/home/opencode/.gitconfig-host:ro"
      # Universal (machine-wide) config: grants every tool for every project.
      # Mounts over the image's /etc/opencode/opencode.json - edit ./opencode.json and restart to change.
      - ./opencode.json:/etc/opencode/opencode.json:ro
      # - ${SSH_AUTH_SOCK}:/ssh-agent
      # - /run/host-services/ssh-auth.sock:/ssh-agent
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETUID, SETGID, KILL, AUDIT_WRITE]
    pids_limit: 4096
    mem_limit: 8g
    restart: unless-stopped

volumes:
  opencode-config:
  opencode-data:
  opencode-workspace:
  opencode-cache:
  opencode-global-skills:
