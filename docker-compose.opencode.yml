name: opencode-docker

services:
  mcp-gateway:
    image: docker/mcp-gateway:latest
    command:
      - --servers=sequentialthinking,playwright,fetch,time,duckduckgo,markitdown,wikipedia-mcp,next-devtools-mcp,npm-sentinel,memory,aws-documentation,github-official,context7,deepwiki,microsoft-learn,grafana,dockerhub,mcp-code-interpreter,n8n
      - --transport=streaming
      - --port=8080
      - --host=0.0.0.0
      - --allow-unauthenticated
      - --secrets=/run/secrets/mcp_secrets
      - --config=/run/secrets/mcp_config
      - --cpus=1
      - --memory=1Gb
    environment:
      DOCKER_MCP_IN_CONTAINER: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway-config.json:/root/.docker/config.json:ro
    secrets:
      - mcp_secrets
      - mcp_config
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8200}:8080"
    mem_limit: 4g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  opencode:
    build:
      context: .
      args: [NODE_TAG, PACKAGES, NPM_PACKAGES, PIP_PACKAGES, SKILLS_REF]
    environment:
      - HOST_HOME=${HOST_HOME:-${HOME:-${USERPROFILE:-/home/opencode}}}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-${GITHUB_TOKEN:-}}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_SIGNING_KEY=${GIT_SIGNING_KEY:-}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      - SSH_AUTH_SOCK=/home/opencode/.ssh/agent/agent.sock
      - MCP_GATEWAY_URL=http://mcp-gateway:8080/mcp
      - EXA_API_KEY=${EXA_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - mcp-gateway
    volumes:
      - opencode-config:/home/opencode/.config/opencode
      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-workspace:/home/opencode/workspace
      - opencode-cache:/home/opencode/.cache
      - opencode-global-skills:/home/opencode/.agents
      - "${HOME:-${USERPROFILE:-/home/opencode}}/.ssh:/home/opencode/.ssh-host:ro"
      - "${HOME:-${USERPROFILE:-/home/opencode}}/.gitconfig:/home/opencode/.gitconfig-host:ro"
      - ./opencode.json:/etc/opencode/opencode.json:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 4096
    mem_limit: 8g
    restart: unless-stopped

secrets:
  mcp_secrets:
    file: ./.env.mcp
  mcp_config:
    file: ./mcp-config.yml

volumes:
  opencode-config:
  opencode-data:
  opencode-workspace:
  opencode-cache:
  opencode-global-skills:
